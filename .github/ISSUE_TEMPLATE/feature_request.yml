name: Feature or science suggestion
description: Propose an improvement, a data source, or a verification idea
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Who benefits, and how would we know it worked (a metric or a check)
