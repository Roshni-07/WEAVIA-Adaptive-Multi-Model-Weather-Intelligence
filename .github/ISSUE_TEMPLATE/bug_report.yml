name: Bug report
description: Something in WEAVIA is broken or gives a wrong result
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you saw instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the URL or API call, and parameters (location, variable, lead, issue date)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Pipeline / science, API, Frontend / globe, Docs, Other]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, browser, Python and Node versions
  - type: checkboxes
    id: data
    attributes:
      label: Data
      options:
        - label: I understand all data in this prototype is synthetic
          required: true
